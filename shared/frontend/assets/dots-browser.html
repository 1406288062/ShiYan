function send(value){

async function flush(keepalive=false){

    const response=await fetch('/api/dots/browser/control',{method:'POST',headers:{'Content-Type':'application/json','X-Shiyan-Local':'1'},credentials:'same-origin',cache:'no-store',keepalive,body:JSON.stringify({sessionToken,messages:batch})});

function handleMessage(data){

async function poll(){
  while(!closed&&sessionToken){
    try{
      const response=await fetch('/api/dots/browser/poll',{
        method:'POST',
        headers:{'Content-Type':'application/json','X-Shiyan-Local':'1'},
        credentials:'same-origin',
        cache:'no-store',
        signal:AbortSignal.timeout(10000),
        body:JSON.stringify(Object.assign(fallbackMode?{sessionToken,wantFrames:true,frameSeq}:{sessionToken},pollDiag?{clientDiag:pollDiag}:{}))
      });

      if(!response.ok){
        const error=new Error(data.error||data.message||'服务器浏览器会话已断开');

      }
      pollFailures=0;
      for(const message of data.messages||[])handleMessage(message);

const setState=(text,isError=false)=>{connection.textContent=text;connection.classList.toggle('error',isError);};
function tabLabel(tab){const url=String(tab.url||'');if(!url||url==='about:blank')return '新标签页';if(tab.title)return tab.title;try{return new URL(url).host||url;}catch(_){return url;}}

function escapeHTML(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function waitForIce(peer,timeout=5000){

async function startRtc(offer){
  if(rtcStarted)return;rtcStarted=true;setState('正在建立 WebRTC 音视频连接…');
  pc=new RTCPeerConnection({iceServers,iceTransportPolicy:'relay',bundlePolicy:'max-bundle'});
  screen.addEventListener('resize',()=>diag('video-resize',screen.videoWidth+'x'+screen.videoHeight+' box='+screen.offsetWidth+'x'+screen.offsetHeight+' sent='+sentView.width+'x'+sentView.height));
  pc.ontrack=event=>{
    if(event.track.kind==='video'){
      screen.srcObject=event.streams[0]||new MediaStream([event.track]);
      screen.play().catch(()=>{});
      hint.hidden=true;startPaintWatch();
    }else if(event.track.kind==='audio'){
      audio.srcObject=new MediaStream([event.track]);
      audio.muted=!audioEnabled;
      if(audioEnabled)audio.play().catch(()=>{});
    }
  };
  pc.onconnectionstatechange=()=>{
    diag('rtc-state',pc.connectionState+' ice='+pc.iceConnectionState);
    if(pc.connectionState==='connected'&&!window.__statsTimer){let n=0;window.__statsTimer=setInterval(async()=>{if(closed||n++>12){clearInterval(window.__statsTimer);return;}try{let v=null,a=null;(await pc.getStats()).forEach(r=>{if(r.type==='inbound-rtp'&&r.kind==='video')v=r;if(r.type==='inbound-rtp'&&r.kind==='audio')a=r;});diag('play-stats','vw='+screen.videoWidth+'x'+screen.videoHeight+' rs='+screen.readyState+' paused='+screen.paused+' src='+!!screen.srcObject+' hidden='+getComputedStyle(screen).visibility+'/'+screen.offsetWidth+' hint='+hint.hidden+' home='+home.hidden+' fb='+fallbackMode+' vDec='+(v?.framesDecoded??'-')+' vBytes='+(v?.bytesReceived??'-')+' vLost='+(v?.packetsLost??'-')+' fps='+(v?.framesPerSecond??'-')+' aBytes='+(a?.bytesReceived??'-')+' audioOn='+audioEnabled);}catch(e){diag('play-stats-error',e.message);}},4000);}
    if(pc.connectionState==='connected'){rtcConnected=true;clearTimeout(rtcWatchdog);leaveFallback();setState('WebRTC 已连接 · 浏览器音视频');hint.hidden=true;}
    else if(pc.connectionState==='failed'){rtcConnected=false;enterFallback('音视频中继不可用');}
    else if(pc.connectionState==='disconnected'){rtcConnected=false;setState('WebRTC 连接中断，正在重连…',true);clearTimeout(rtcWatchdog);rtcWatchdog=setTimeout(()=>{if(!rtcConnected)enterFallback('音视频连接中断');},5000);}
  };
  pc.oniceconnectionstatechange=()=>{if(pc.iceConnectionState==='failed')enterFallback('中继连接失败');};
  clearTimeout(rtcWatchdog);rtcWatchdog=setTimeout(()=>{if(!rtcConnected)enterFallback('音视频连接超时');},6000);
  pc.onicecandidateerror=event=>diag('ice-error',(event.errorCode||'')+' '+(event.errorText||'')+' '+(event.url||''));
  diag('offer-received',navigator.userAgent);
  await pc.setRemoteDescription({type:'offer',sdp:offer});
  const answer=await pc.createAnswer();await pc.setLocalDescription(answer);diag('answer-created','gathering='+pc.iceGatheringState);
  await waitForIce(pc);
  const sdp=pc.localDescription?.sdp||'';const cands=(sdp.match(/a=candidate/g)||[]).length;diag('answer-queued','candidates='+cands+' gathering='+pc.iceGatheringState+' bytes='+sdp.length);
  // No relay candidate gathered (TURN allocation failed, e.g. the client network drops UDP): the
  // video will never connect, so switch to JPEG frames at once instead of waiting out the watchdog.
  if(!cands&&!rtcConnected)enterFallback('没有可用的音视频中继候选');
  if(!sdp.startsWith('v=0'))throw new Error('WebRTC Answer SDP 为空');
  const tuned=sdp.replace(/^(a=fmtp:(\d+) .*)$/gm,(line,whole,pt)=>/x-google-/.test(line)||!new RegExp('^a=rtpmap:'+pt+' (VP8|VP9|H264|AV1)/','m').test(sdp)?line:line+';x-google-start-bitrate=2500;x-google-min-bitrate=1500;x-google-max-bitrate=5000').replace(/^(a=rtpmap:(\d+) (VP8|VP9)\/90000)$/gm,(line,whole,pt)=>new RegExp('^a=fmtp:'+pt+' ','m').test(sdp)?line:line+'\r\na=fmtp:'+pt+' x-google-start-bitrate=2500;x-google-min-bitrate=1500;x-google-max-bitrate=5000');
  send({type:'rtc-answer',sdp:tuned});
  await flush();diag('answer-posted','queued='+outgoing.some(item=>item.type==='rtc-answer')+' flushing='+flushing);
}
function connect(){
  const hash=new URLSearchParams(location.hash.slice(1)),ticket=hash.get('ticket');
  // Takeover of a Dots browser task: the user drives the task's window, then hands it back.
  if(hash.get('task')){const back=$('handback');back.hidden=false;back.addEventListener('click',()=>{try{parent.postMessage({type:'shiyan-browser-handback'},location.origin);}catch(_){}});setState('你正在接管 Dots 的浏览器任务');}
  history.replaceState(null,'',location.pathname+location.search);
  if(!ticket){setState('电脑入口已过期，请重新打开',true);hint.innerHTML='<div><strong>连接凭证已失效</strong>请关闭窗口后重新打开电脑入口</div>';return;}
  // 启动服务器上的 Chrome 要十几秒；网络慢或中途断开时自动重试（同一凭证 2 分钟内可重复兑换，拿到的是同一个会话）。
  setState('正在启动服务器浏览器…');
  const exchange=async attempt=>{
    let response,data;
    try{response=await fetch('/api/dots/browser/exchange',{method:'POST',headers:{'Content-Type':'application/json','X-Shiyan-Local':'1'},credentials:'same-origin',cache:'no-store',body:JSON.stringify({ticket})});}
    catch(_){if(attempt<4){setState('网络不稳定，正在重新连接服务器浏览器…（'+attempt+'/3）');await new Promise(r=>setTimeout(r,1500*attempt));return exchange(attempt+1);}throw new Error('网络连接中断，请检查网络后重新打开');}
    data=await response.json().catch(()=>null);
    if(response.ok&&data)return data;
    if(!data&&(response.status>=500||response.status===0)&&attempt<4){setState('服务器浏览器还在启动，正在重试…（'+attempt+'/3）');await new Promise(r=>setTimeout(r,1500*attempt));return exchange(attempt+1);}
    throw new Error((data&&(data.error||data.message))||('无法启动服务器浏览器（HTTP '+response.status+'）'));
  };
  exchange(1)
    .then(data=>{if(!data.sessionToken||!Array.isArray(data.iceServers))throw new Error('服务器没有返回完整的浏览器连接配置');iceServers=data.iceServers;openTransport(data.sessionToken);})
    .catch(error=>{setState(error.message,true);hint.hidden=false;hint.innerHTML='<div><strong>无法连接服务器电脑</strong>'+escapeHTML(error.message)+'</div>';});
}
const darkQuery=matchMedia('(prefers-color-scheme: dark)');
const sendScheme=()=>send({type:'color-scheme',value:darkQuery.matches?'dark':'light'});
try{darkQuery.addEventListener('change',sendScheme);}catch(_){}
window.addEventListener('pagehide',()=>{if(!sessionToken||closed)return;try{fetch('/api/dots/browser/control',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json','X-Shiyan-Local':'1'},credentials:'same-origin',body:JSON.stringify({sessionToken,messages:[{type:'close'}]})});}catch(_){}});
function openTransport(token){
  sessionToken=token;sendScheme();setState('已连接 · 正在启动音视频');hint.hidden=false;resize();
  void poll();send({type:'rtc-start'});diag('transport-open',navigator.userAgent+' visibility='+document.visibilityState);
  setTimeout(()=>{if(!rtcConnected)enterFallback('音视频连接超时');},8000);
  if(pendingNavigation){const url=pendingNavigation;pendingNavigation=null;void executeNavigation(url);}
}
function resize(){if(!sessionToken)return;const rect=wrap.getBoundingClientRect();const width=Math.max(320,Math.min(1400,Math.round(rect.width)));const height=Math.max(420,Math.min(1000,Math.round(rect.height)));sentView={width,height};diag('resize-sent',width+'x'+height+' dpr='+(window.devicePixelRatio||1));send({type:'resize',width,height,scale:Math.min(2,window.devicePixelRatio||1)});}
function scheduleResize(){clearTimeout(resizeTimer);resizeTimer=setTimeout(resize,180);}
new ResizeObserver(scheduleResize).observe(wrap);window.addEventListener('orientationchange',scheduleResize);
try{matchMedia('(resolution: 2dppx)').addEventListener('change',scheduleResize);}catch(_){}
let navigationInFlight=false,lastRequestedUrl='';
async function executeNavigation(value){
  if(!sessionToken){pendingNavigation=value;return;}
  if(navigationInFlight)return;
  navigationInFlight=true;lastRequestedUrl=value;home.hidden=true;menu.hidden=true;
  setState('正在打开 '+value);hint.hidden=false;hint.innerHTML='<div><strong>正在打开网页</strong>'+escapeHTML(value)+'</div>';
  try{
    const response=await fetch('/api/dots/browser/control',{method:'POST',headers:{'Content-Type':'application/json','X-Shiyan-Local':'1'},credentials:'same-origin',cache:'no-store',body:JSON.stringify({sessionToken,messages:[{type:'navigate',url:value}]})});
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.error||data.message||'网页导航请求失败');
    setState('已提交导航，正在等待画面：'+value);
  }catch(error){
    setState(error.message||'网页打开失败',true);hint.hidden=false;hint.innerHTML='<div><strong>网页打开失败</strong>'+escapeHTML(error.message||'请重试')+'</div>';
    address.value=value;
  }finally{navigationInFlight=false;}
}
function navigateFromAddress(){const value=address.value.trim();if(!value)return;void executeNavigation(value);}
$('addressForm').addEventListener('submit',event=>{event.preventDefault();navigateFromAddress();keyboard.blur();});
address.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();navigateFromAddress();keyboard.blur();}});
function showHome(){home.hidden=false;address.value='';menu.hidden=true;}
$('closeBrowser').addEventListener('click',()=>{try{parent.postMessage({type:'shiyan-browser-close'},location.origin);}catch(_){}});$('toolbarMenu').addEventListener('click',()=>{menu.hidden=!menu.hidden;});const newTab=()=>{menu.hidden=true;address.value='';home.hidden=false;send({type:'tab-new'});setTimeout(()=>address.focus(),60);};
$('menuNewTab').addEventListener('click',newTab);$('tabAdd').addEventListener('click',newTab);
$('tabs').addEventListener('click',event=>{const close=event.target.closest('[data-close-tab]');if(close){event.stopPropagation();send({type:'tab-close',id:close.dataset.closeTab});return;}const item=event.target.closest('[data-tab]');if(item&&item.dataset.tab!==tabsState.active){send({type:'tab-switch',id:item.dataset.tab});}});
$('tabs').addEventListener('auxclick',event=>{const item=event.target.closest('[data-tab]');if(event.button===1&&item)send({type:'tab-close',id:item.dataset.tab});});$('menuHome').addEventListener('click',showHome);$('menuReload').addEventListener('click',()=>{menu.hidden=true;home.hidden=true;send({type:'reload'});});$('sound').addEventListener('click',()=>{menu.hidden=true;});
$('back').addEventListener('click',()=>{home.hidden=true;send({type:'back'});});$('forward').addEventListener('click',()=>{home.hidden=true;send({type:'forward'});});$('reload').addEventListener('click',()=>{home.hidden=true;send({type:'reload'});});
sound.addEventListener('click',()=>{
  audioEnabled=!audioEnabled;audio.muted=!audioEnabled;sound.classList.toggle('sound-on',audioEnabled);
  sound.textContent=audioEnabled?'◖))':'◖))';sound.title=audioEnabled?'关闭声音':'开启声音';sound.setAttribute('aria-label',sound.title);
  if(audioEnabled)audio.play().then(()=>setState('WebRTC 已连接 · 声音已开启')).catch(()=>{setState('请再次点击声音按钮以播放',true);});
  else setState('WebRTC 已连接 · 声音已关闭');
});
function point(event){
  const useImg=fallbackMode&&fallbackScreen.naturalWidth;
  const rect=screen.getBoundingClientRect(),vw=(useImg?fallbackScreen.naturalWidth:screen.videoWidth)||1120,vh=(useImg?fallbackScreen.naturalHeight:screen.videoHeight)||720;
  const scale=Math.min(rect.width/vw,rect.height/vh),displayWidth=vw*scale,displayHeight=vh*scale;
  const offsetX=(rect.width-displayWidth)/2,offsetY=(rect.height-displayHeight)/2;
  const kx=sentView.width/vw,ky=sentView.height/vh;
  return{x:Math.max(0,Math.min(sentView.width,Math.round((event.clientX-rect.left-offsetX)/scale*kx))),y:Math.max(0,Math.min(sentView.height,Math.round((event.clientY-rect.top-offsetY)/scale*ky)))};
}
screen.addEventListener('contextmenu',event=>event.preventDefault());
screen.addEventListener('pointerdown',event=>{
  if(event.pointerType==='mouse'&&![0,1,2].includes(event.button))return;
  event.preventDefault();screen.setPointerCapture?.(event.pointerId);const p=point(event),button=event.pointerType==='mouse'?(['left','middle','right'][event.button]||'left'):'left';
  pointer={...p,lastX:p.x,lastY:p.y,scrolling:false,type:event.pointerType,button};
  send({type:'mouse',eventType:'mousePressed',x:p.x,y:p.y,button,clickCount:event.detail===2?2:1});
  keyboard.focus({preventScroll:true});
});
screen.addEventListener('pointermove',event=>{const p=point(event);if(pointer&&pointer.type==='touch'){
  const distance=Math.abs(p.x-pointer.x)+Math.abs(p.y-pointer.y);
  if(!pointer.scrolling&&distance>8){pointer.scrolling=true;send({type:'mouse',eventType:'mouseReleased',x:pointer.x,y:pointer.y,button:pointer.button});}
  if(pointer.scrolling)send({type:'wheel',x:p.x,y:p.y,deltaX:pointer.lastX-p.x,deltaY:pointer.lastY-p.y});
  else send({type:'mouse',eventType:'mouseMoved',x:p.x,y:p.y,button:'none'});
  pointer.lastX=p.x;pointer.lastY=p.y;
}else send({type:'mouse',eventType:'mouseMoved',x:p.x,y:p.y,button:'none'});});
function release(event){if(!pointer)return;const p=point(event);if(!pointer.scrolling)send({type:'mouse',eventType:'mouseReleased',x:p.x,y:p.y,button:pointer.button});pointer=null;}
screen.addEventListener('pointerup',release);screen.addEventListener('pointercancel',release);
wrap.addEventListener('wheel',event=>{event.preventDefault();const p=point(event);send({type:'wheel',x:p.x,y:p.y,deltaX:event.deltaX,deltaY:event.deltaY});},{passive:false});
function modifiers(event){return(event.altKey?1:0)|(event.ctrlKey?2:0)|(event.metaKey?4:0)|(event.shiftKey?8:0);}
keyboard.addEventListener('input',()=>{const value=keyboard.value;if(value){send({type:'insertText',text:value});keyboard.value='';}});
keyboard.addEventListener('keydown',event=>{
  if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='l'){event.preventDefault();address.focus();address.select();return;}
  if(['Backspace','Enter','Tab','Escape','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Delete','Home','End','PageUp','PageDown'].includes(event.key)){
    event.preventDefault();const payload={type:'key',eventType:'keyDown',key:event.key,code:event.code,modifiers:modifiers(event)};send(payload);send({...payload,eventType:'keyUp'});
  }
});
function close(){if(closed)return;send({type:'close'});void flush(true);closed=true;clearTimeout(flushTimer);clearTimeout(moveTimer);clearInterval(paintWatchTimer);try{pc?.close();}catch{}try{audio.pause();audio.srcObject=null;}catch{}try{screen.pause();screen.srcObject=null;}catch{}}
window.addEventListener('pagehide',close,{once:true});
connect();
